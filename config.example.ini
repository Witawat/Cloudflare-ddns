[cloudflare]
; API Token จาก https://dash.cloudflare.com/profile/api-tokens
; สิทธิ์ที่ต้องให้: Zone > DNS > Edit
api_token =

; อัปเดตทุกกี่วินาที (ขั้นต่ำ 15)
interval_seconds = 60

; เปิด/ปิดการอัปเดตแต่ละชนิด IP
use_ipv4 = true
use_ipv6 = true

; Web UI (http://127.0.0.1:8123) - เปิดเฉพาะเครื่องนี้ ถ้าเว้นว่างไม่ต้องใช้รหัส
webui_port = 8123
webui_password =

; --- แจ้งเตือน Telegram (เว้นว่างทั้งคู่ = ปิด) ---
; สร้าง bot ผ่าน @BotFather แล้วใส่ token / chat_id
; หา chat_id ง่าย ๆ: รัน setup แล้วตอบ y ตรงคำถาม Telegram
; (หรือส่ง /start ให้ bot แล้วเรียก getUpdates ดู message.chat.id)
telegram_bot_token =
telegram_chat_id =

; เปิด/ปิดการแจ้งเตือนแต่ละเหตุการณ์
notify_start = true
notify_stop = true
notify_ip_change = true
notify_error = true
notify_created = true

; สรุปสถานะประจำวันทาง Telegram (เวลา HH:MM)
daily_report = true
daily_report_time = 08:00

; --- Cloudflare Tunnel (ไม่บังคับ) ---
; ใช้เมื่อต้องการให้บริการผ่าน Tunnel แทนการเปิดพอร์ต/พึ่ง IP ตรง
; (เหมาะกับ CGNAT หรือไม่อยากเปิดพอร์ต) - token จาก Zero Trust > Networks > Tunnels
tunnel_enabled = false
tunnel_token =
; cloudflared.exe (เว้นว่าง = ดาวน์โหลดข้าง exe อัตโนมัติ)
cloudflared_path =
; รายการ hostname ที่ผูกกับ tunnel (JSON) - ปกติ "ซิงค์จาก Cloudflare" ในเว็บจะเขียนให้เอง
; รูปแบบ: [{"hostname":"app.โดเมน.com","path":"","protocol":"http","service":"http://localhost:8080"}]
; path: ใช้หลายพอร์ตต่อชื่อเดียว (เช่น "/api") / protocol: http https tcp udp
tunnel_hosts = []

; ที่เก็บ log (เว้นว่าง = %PROGRAMDATA%\CloudflareDDNS\logs)
log_dir =

; คัดลอก [record:...] ด้านล่างเพิ่มได้เรื่อย ๆ ต่อ record หนึ่งตัวต่อหนึ่งชื่อ
; zone: ชื่อ zone ใน Cloudflare (ถ้าเว้น จะพยายามเดาจากชื่อ record)
; proxied: true = ผ่าน orange cloud ของ Cloudflare
; ttl: 60-7200 (วินาที) - ใช้ 60 เพื่อให้ IP ใหม่กระจายเร็วที่สุด
; ipv4 / ipv6: อัปเดต A / AAAA ของ record นี้หรือไม่

[record:example.com]
zone = example.com
proxied = false
ttl = 120
ipv4 = true
ipv6 = true

[record:home.example.com]
zone = example.com
proxied = true
ttl = 300
ipv4 = true
ipv6 = false
