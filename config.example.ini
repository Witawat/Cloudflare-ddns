[cloudflare]
; API Token จาก https://dash.cloudflare.com/profile/api-tokens
; สิทธิ์ที่ต้องให้: Zone > DNS > Edit
api_token =

; อัปเดตทุกกี่วินาที (ขั้นต่ำ 15)
interval_seconds = 60

; เปิด/ปิดการอัปเดตแต่ละชนิด IP
use_ipv4 = true
use_ipv6 = true

; ตรวจฉันทามติ IP: ต้องมี provider ตรวจ IP อย่างน้อย 2 รายเห็น IP ตัวเดียวกัน
; ถึงจะอัปเดต record (กัน provider ตัวใดตัวหนึ่งตอบผิด/ล้าสมัย — ระวัง: ถ้าเน็ตมีปัญหา IP จะขึ้น "หาไม่ได้" แทน)
ip_consensus = false

; กัน IP ที่เป็นของ Cloudflare เอง (anycast/CDN) ถูกเขียนลง record โดยไม่ตั้งใจ
; (ถ้าตรวจ IP ได้ IP ที่อยู่ในช่วงของ Cloudflare -> ข้ามรอบ ไม่แก้ record)
reject_cloudflare_ips = true

; --- Heartbeat monitoring (ไม่บังคับ) ---
; ส่งสัญญาณ "ยังทำงาน" ทุกรอบ DDNS ให้บริการเฝ้าดูจากนอกบ้าน (รู้ว่าเครื่อง/program ตาย)
; - Healthchecks.io (ฟรี): สมัครที่ healthchecks.io แล้วสร้าง Check -> ใช้ Ping URL
;   เช่น https://hc-ping.com/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
; - Uptime Kuma (self-host): สร้าง monitor ชนิด "Push" แล้วใช้ push URL
;   เช่น https://kuma.คุณ.com/api/push/xxxxxxxxxxxx
healthchecks_url =
uptimekuma_url =

; Web UI (http://127.0.0.1:8123) - เปิดเฉพาะเครื่องนี้ ถ้าเว้นว่างไม่ต้องใช้รหัส
; webui_host: 127.0.0.1 = เฉพาะเครื่องนี้ (ค่าเริ่มต้น) · 0.0.0.0 = เข้าจากเครื่องอื่นใน LAN ได้
;   (ถ้าใช้ 0.0.0.0 ต้องตั้ง webui_password + เปิดพอร์ต firewall: netsh advfirewall firewall add rule name="CloudflareDDNS WebUI" dir=in action=allow protocol=TCP localport=8123)
webui_port = 8123
webui_host = 127.0.0.1
; webui_password เก็บเป็น hash อัตโนมัติ (รหัสลืมได้: รัน "reset-password" หรือเปิดฟีเจอร์กู้ทาง Telegram ด้านล่าง)
webui_password =

; --- แจ้งเตือน Telegram (เว้นว่างทั้งคู่ = ปิด) ---
; สร้าง bot ผ่าน @BotFather แล้วใส่ token / chat_id
; หา chat_id ง่าย ๆ: รัน setup แล้วตอบ y ตรงคำถาม Telegram
; (หรือส่ง /start ให้ bot แล้วเรียก getUpdates ดู message.chat.id)
telegram_bot_token =
telegram_chat_id =

; เปิด/ปิดการแจ้งเตือนแต่ละเหตุการณ์
notify_start = true
notify_stop = true
notify_ip_change = true
notify_error = true
notify_created = true
; ส่งสรุปสั้นทุกครั้งที่ตรวจรอบ (ระวัง: รอบสั้น = ข้อความเยอะ)
notify_round = false

; สรุปสถานะประจำวันทาง Telegram (เวลา HH:MM)
daily_report = true
daily_report_time = 08:00

; กู้รหัสผ่านหน้าเว็บผ่าน Telegram (opt-in — ปิด default) — ลืมรหัสหน้าเว็บ?
; พิมพ์ "reset password" ในแชทกับ bot แล้วยืนยัน "yes" -> โปรแกรมสุ่มรหัสใหม่ส่งกลับ (เฉพาะ chat_id ข้างบน กัน 1 ครั้ง/10 นาที)
telegram_allow_reset = false
; ชื่อเครื่องสำหรับรับคำสั่ง Telegram (เว้นว่าง = ชื่อเครื่องของระบบ)
; ใช้ bot ตัวกลางร่วมหลายเครื่อง: พิมพ์ /status @ชื่อเครื่อง — เฉพาะเครื่องที่ชื่อตรงตอบ
telegram_command_name =
; ภาษาข้อความ Telegram (notify + คำสั่ง /status /list ฯลฯ) — th | en (log ไฟล์คงไทยเสมอ)
language = th

; --- Cloudflare Tunnel (ไม่บังคับ) ---
; ใช้เมื่อต้องการให้บริการผ่าน Tunnel แทนการเปิดพอร์ต/พึ่ง IP ตรง
; (เหมาะกับ CGNAT หรือไม่อยากเปิดพอร์ต) - token จาก Zero Trust > Networks > Tunnels
tunnel_enabled = false
tunnel_token =
; cloudflared.exe (เว้นว่าง = ดาวน์โหลดข้าง exe อัตโนมัติ)
cloudflared_path =
; รายการ hostname ที่ผูกกับ tunnel (JSON) - ปกติ "ซิงค์จาก Cloudflare" ในเว็บจะเขียนให้เอง
; รูปแบบ: [{"hostname":"app.โดเมน.com","path":"","protocol":"http","service":"http://localhost:8080"}]
; path: ใช้หลายพอร์ตต่อชื่อเดียว (เช่น "/api") / protocol: http https tcp udp
tunnel_hosts = []

; ที่เก็บ log (เว้นว่าง = โฟลเดอร์เดียวกับ exe: logs\)
log_dir =

; คัดลอก [record:...] ด้านล่างเพิ่มได้เรื่อย ๆ ต่อ record หนึ่งตัวต่อหนึ่งชื่อ
; zone: ชื่อ zone ใน Cloudflare (ถ้าเว้น จะพยายามเดาจากชื่อ record)
; proxied: true = ผ่าน orange cloud ของ Cloudflare
; ttl: 60-7200 (วินาที) - ใช้ 60 เพื่อให้ IP ใหม่กระจายเร็วที่สุด
; ipv4 / ipv6: อัปเดต A / AAAA ของ record นี้หรือไม่
; ชื่อ wildcard ได้: [record:*.example.com] หรือ [record:*] + zone = example.com
;   (ทุกซับโดเมนชี้มาบ้านนี้ — สร้าง record เฉพาะทับได้ที่ Cloudflare)

[record:example.com]
zone = example.com
proxied = false
ttl = 120
ipv4 = true
ipv6 = true

[record:home.example.com]
zone = example.com
proxied = true
ttl = 300
ipv4 = true
ipv6 = false
